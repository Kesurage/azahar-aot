name: library-mh4u

# MH4U ONLY (its own recompiler, with the port's hooks). For every other game use library-aot.
# Builds the game's code library (arm64 .so) from YOUR OWN decrypted update .cia, which you
# keep as an asset of a release in this PRIVATE repository. Manual runs only: never on pull
# requests or forks. The output is derived from the game, so it stays an Actions artifact
# (private, short retention) and is never committed or attached to a release.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release (not draft) that holds the update .cia"
        default: "game-data"
      opt:
        description: "O0 builds fastest, O1/O2 run faster"
        default: "O1"

permissions:
  contents: write

jobs:
  lib:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Refuse to run in a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vis=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          [ "$vis" = "private" ] || { echo "repository is $vis, refusing"; exit 1; }

      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r repo/mh4u/requirements.txt

      - name: NDK 27
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "using $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$SDK" "ndk;27.3.13750724"

      - name: Fetch your update .cia from the private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p repo/mh4u/data
          cd repo/mh4u
          mkdir -p data
          gh release download "${{ inputs.release_tag }}" --pattern 'update.cia*' --dir data
          ls -l data

      - name: Join split files
        working-directory: repo/mh4u
        run: |
          if ls data/update.cia.part-* >/dev/null 2>&1; then cat data/update.cia.part-* > data/update.cia; rm data/update.cia.part-*; fi

      - name: Mark a plain update as decrypted (leftover encryption flags)
        run: python3 -I repo/tools/fix_dump_flags.py repo/mh4u/data/update.cia

      - name: Decrypt (only if you uploaded update.cia.enc)
        working-directory: repo/mh4u
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          if [ -f data/update.cia.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in data/update.cia.enc -out data/update.cia -pass env:DATA_KEY
            rm data/update.cia.enc
          fi
          test -f data/update.cia

      - name: Build the code library
        working-directory: repo/mh4u
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          port/android/build-code-library.sh data/update.cia "${{ inputs.opt }}"

      - name: Publish to the builds release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="-R $GITHUB_REPOSITORY"
          gh $R release create builds --title "Builds" --notes "AOT code libraries and APK" --prerelease || true
          gh $R release upload builds repo/mh4u/build/android/recomp/*.so --clobber
          gh $R release view builds --json assets --jq '.assets[].name'

      - name: Remove game data from the runner
        if: always()
        run: rm -rf repo/mh4u/data repo/mh4u/build
