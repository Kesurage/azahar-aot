name: android-aot

# Builds the Android APK: the MH4U app + Azahar core (your AzaharPlus fork) + both CPU backends:
# the MH4U-specific recompiled code and the generic 3dsrecomp AOT backend (aot/).
# The game's code library is NOT built here: use the library-aot workflow (3dsrecomp, any
# title) or mh4u/.github/workflows/library.yml (MH4U's own recompiler).

on:
  workflow_dispatch:
    inputs:
      azahar_repo:
        description: "AzaharPlus fork the patch was written against (owner/name)"
        default: "klark231/AzaharPlus"
      azahar_ref:
        description: "Branch, tag or commit of that repo"
        default: "locale-translations"
  push:
    tags: ["android-v*"]

permissions:
  contents: write   # to attach the APK to a release on tags

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h /

      # If the fork is private, add a secret AZAHAR_TOKEN (a fine-grained token with
      # read access to contents of that repo). For a public fork it is not needed.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.azahar_repo || 'klark231/AzaharPlus' }}
          ref: ${{ inputs.azahar_ref || 'locale-translations' }}
          token: ${{ secrets.AZAHAR_TOKEN || github.token }}
          submodules: recursive
          path: azahar

      - name: Apply the patches (MH4U Android patch, then the CRO observer for the AOT backend)
        working-directory: azahar
        run: |
          for p in ../repo/mh4u/port/azahar/azahar-android.patch ../repo/patches/0002-ldr-ro-cro-observer.patch; do
            if git apply --check "$p" 2>/dev/null; then
              git apply "$p" && echo "applied $p"
            elif git apply --reverse --check "$p" 2>/dev/null; then
              echo "$p is already in this branch, skipping"
            else
              git apply --check "$p"   # fails with the reason
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: NDK 27 and CMake
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "using $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$SDK" "ndk;27.3.13750724" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          # It scans the whole workspace and trips on SDL's sample wrapper jar under
          # azahar/externals, which this build never runs (we use the installed Gradle).
          validate-wrappers: false

      # The one key every build is signed with (port/android/SIGNING.md). Without the secrets
      # the APK is signed with a throwaway debug key and can't update an installed build.
      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mh4u-release.jks"
            echo "MH4U_KEYSTORE_FILE=$RUNNER_TEMP/mh4u-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: this APK gets a debug key and cannot update an installed build"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: repo/mh4u/port/android
        env:
          MH4U_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MH4U_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MH4U_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MH4U_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon -Pazahar.dir=${{ github.workspace }}/azahar

      - name: Show the signature
        run: |
          APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/35.0.0/apksigner)
          for apk in repo/mh4u/port/android/app/build/outputs/apk/release/*.apk; do
            echo "$apk"; "$APKSIGNER" verify --print-certs "$apk" | grep -E "SHA-256|Signer #1 certificate DN"
          done
          rm -f "$RUNNER_TEMP/mh4u-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: azahar-aot-android
          path: repo/mh4u/port/android/app/build/outputs/apk/release/*.apk

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: repo/mh4u/port/android/app/build/outputs/apk/release/*.apk
          draft: true
